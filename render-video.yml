name: Render Prediabetes Explainer Video

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install fonts (DejaVu Serif)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core fonts-dejavu-extra
          fc-cache -f

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Download browser for Remotion
        run: npx remotion browser ensure

      - name: Render video (3,600 frames, 30 fps, 1920x1080)
        run: npm run build

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: PrediabetesExplainer
          path: out/PrediabetesExplainer.mp4
          retention-days: 14
