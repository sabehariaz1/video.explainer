name: Render Prediabetes Explainer Videos (English + Arabic)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install fonts (DejaVu Serif + Noto Arabic)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core fonts-dejavu-extra fonts-noto-core
          fc-cache -f
          fc-list :lang=ar family | sort -u | head

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run typecheck

      - name: Download browser for Remotion
        run: npx remotion browser ensure

      - name: Render English video (3,600 frames, 30 fps, 1920x1080)
        run: npm run build

      - name: Render Arabic video (1920x1080, 30 fps)
        run: npm run build:ar

      - name: Upload MP4 files
        uses: actions/upload-artifact@v4
        with:
          name: PrediabetesExplainer-videos
          path: out/*.mp4
          retention-days: 14
